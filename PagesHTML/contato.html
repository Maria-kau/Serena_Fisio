<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamento | Dra. Helena Lopes</title>

    <!-- CSS principal -->
    <link rel="stylesheet" href="../css/main.css">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body>

    <!-- Cabeçalho -->
    <div id="header"></div>

    <!-- Conteúdo principal -->
    <main class="appointment-main">

        <section class="appointment-section">

            <div class="appointment-header">
                <h1>Agende sua consulta</h1>
                <p>Preencha seus dados para solicitar um agendamento.</p>
            </div>

            <form id="appointment-form">

                <!-- Dados pessoais -->
                <fieldset class="form-group">

                    <legend>Dados pessoais</legend>

                    <div class="form-field">
                        <label for="name">Nome completo</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Digite seu nome completo"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="birth">Data de nascimento</label>
                        <input
                            type="date"
                            id="birth"
                            name="birth"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            required
                        >
                    </div>

                    <div class="form-field">
                        <label for="phone">Telefone</label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="(00) 00000-0000"
                            required
                        >
                    </div>

                </fieldset>

                <!-- Tipo de atendimento -->
                <fieldset class="form-group">

                    <legend>Tipo de atendimento</legend>

                    <div class="form-field">
                        <label for="service">Selecione o serviço</label>

                        <select id="service" name="service" required>
                            <option value="">Selecione uma opção</option>
                            <option value="avaliacao">Avaliação inicial</option>
                            <option value="sessao">Sessão individual</option>
                            <option value="retorno">Retorno</option>
                            <option value="pilates">Pilates clínico</option>
                        </select>
                    </div>

                </fieldset>

                <!-- Data do agendamento -->
                <fieldset class="form-group">

                    <legend>Escolha uma data</legend>

                    <div class="form-field">
                        <label for="appointment-date">Data disponível</label>

                        <input
                            type="date"
                            id="appointment-date"
                            name="appointment_date"
                            required
                        >
                    </div>

                </fieldset>

                <!-- Horário -->
                <fieldset class="form-group">

                    <legend>Escolha um horário</legend>

                    <div class="form-field">
                        <label for="appointment-time">Horário disponível</label>

                        <select
                            id="appointment-time"
                            name="appointment_time"
                            required
                        >
                            <option value="">Selecione um horário</option>
                            <option value="08:00">08:00</option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                        </select>
                    </div>

                </fieldset>

                <!-- Observações -->
                <div class="form-field">
                    <label for="notes">Observações (opcional)</label>

                    <textarea
                        id="notes"
                        name="notes"
                        placeholder="Deseja informar algo?"
                        rows="4"
                    ></textarea>
                </div>

                <button type="submit" class="appointment-button">
                    Solicitar agendamento
                </button>

            </form>

        </section>
        <!-- Serviços -->
        <section class="services-section" id="servicos">

            <h2>Nossos Serviços</h2>

            <div id="services-container"></div>

        </section>

    </main>

    <!-- Rodapé inserido pelo JavaScript -->
    <div id="footer"></div>

    <!-- JavaScript principal -->
    <script type="module" src="../js/main.js"></script>

</body>
</html>
